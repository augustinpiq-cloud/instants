<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Instants">
<meta name="theme-color" content="#1F3329">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<title>Instants — le carnet du groupe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22; --ink-soft:#4B564C;
    --paper:#F6F1E4; --paper-dim:#EEE7D4;
    --pine:#1F3329; --pine-deep:#182720;
    --gold:#C9A24C; --gold-soft:#E4CE93;
    --teal:#4C7A6C; --rose:#A66B63;
    --line:#D9CFB3; --radius:14px; --danger:#B5453D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--pine-deep);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
  }
  ::selection{ background:var(--gold-soft); }
  button, input{ font-family:inherit; }

  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .screen{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  /* ---------- Loading / auth ---------- */
  .center-screen{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; text-align:center;
  }
  .brand-block{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:6px; }
  .brand-mark{ width:13px;height:13px;border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(201,162,76,0.2); }
  .brand-title{ font-family:'Fraunces', serif; font-weight:700; font-size:32px; margin:0; color:var(--pine); }
  .brand-sub{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--ink-soft); }
  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--pine);
    animation:spin 0.8s linear infinite; margin-top:18px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .auth-card{ width:100%; max-width:340px; margin-top:14px; }
  .auth-tabs{ display:flex; background:var(--paper-dim); border-radius:12px; padding:4px; margin-bottom:22px; }
  .auth-tab{ all:unset; flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; }
  .auth-tab.active{ background:#fff; color:var(--pine); box-shadow:0 2px 6px rgba(31,51,41,0.12); }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .field input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:14.5px; outline:none; background:#fff;
  }
  .field input:focus{ border-color:var(--teal); }
  .pin-row{ display:flex; gap:8px; }
  .pin-row input{ text-align:center; letter-spacing:2px; }
  .color-picker{ display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .color-swatch{
    width:32px;height:32px;border-radius:50%; cursor:pointer; border:3px solid transparent;
  }
  .color-swatch.selected{ border-color:var(--pine); }
  .form-error{ color:var(--danger); font-size:12.5px; margin:-6px 0 12px; text-align:left; }
  .btn-primary{
    all:unset; cursor:pointer; display:block; text-align:center;
    background:var(--pine); color:var(--paper);
    padding:13px 20px; border-radius:11px; font-size:14.5px; font-weight:500; width:100%;
  }
  .btn-primary:hover{ background:var(--pine-deep); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-secondary{
    all:unset; cursor:pointer; display:block; text-align:center;
    background:var(--paper-dim); color:var(--ink);
    padding:13px 20px; border-radius:11px; font-size:14.5px; font-weight:500; width:100%;
  }
  .btn-secondary:hover{ background:var(--line); }
  .btn-text{ all:unset; cursor:pointer; color:var(--teal); font-size:13px; font-weight:500; }
  .helper-text{ font-size:12px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }
  .avatar-upload-zone{
    width:72px; height:72px; border-radius:50%; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--ink-soft); font-size:11px; text-align:center; overflow:hidden; background:#fff;
  }
  .avatar-upload-zone img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Header ---------- */
  .app-header{
    padding:max(16px, env(safe-area-inset-top)) 18px 14px;
    background:var(--pine);
    color:var(--paper);
    display:flex; align-items:center; gap:12px;
    flex-shrink:0;
  }
  .app-header h2{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon-btn{
    all:unset; cursor:pointer; width:34px;height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    color:var(--paper); flex-shrink:0;
  }
  .icon-btn:hover{ background:rgba(246,241,228,0.12); }
  .header-avatar{
    width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:#fff; cursor:pointer; flex-shrink:0;
  }

  /* ---------- Home ---------- */
  .home-content{ padding:18px 18px 90px; }
  .section-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin:0 0 10px; }
  .group-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px; cursor:pointer; display:flex; align-items:center; gap:12px;
    transition:transform 0.12s ease;
  }
  .group-card:hover{ transform:translateY(-1px); }
  .group-thumb{ width:52px;height:52px;border-radius:12px; object-fit:cover; background:var(--paper-dim); flex-shrink:0; }
  .group-thumb.placeholder{ display:flex; align-items:center; justify-content:center; font-size:20px; }
  .group-card .info{ min-width:0; flex:1; }
  .group-card .gname{ font-weight:600; font-size:15px; margin:0 0 2px; }
  .group-card .gmeta{ font-size:12px; color:var(--ink-soft); margin:0; }
  .new-moments{
    display:flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:#2E6FE0; margin:5px 0 0;
  }
  .dot-badge{ width:8px; height:8px; border-radius:50%; background:#2E6FE0; flex-shrink:0; }
  .group-card .chev{ color:var(--ink-soft); flex-shrink:0; }
  .empty-state{
    text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:14px; line-height:1.6;
  }
  .empty-state .big-emoji{ font-size:36px; display:block; margin-bottom:10px; }
  .home-actions{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    display:flex; border-top:1px solid var(--line); background:#fff;
    padding:8px 10px max(8px, env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .nav-btn{
    all:unset; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; cursor:pointer; color:var(--ink-soft); font-size:10.5px; font-weight:500;
  }
  .nav-btn .ic{ font-size:19px; }
  .nav-btn.active{ color:var(--pine); }

  /* ---------- Group screen ---------- */
  .segmented{ display:flex; gap:2px; padding:12px 18px 0; }
  .seg-btn{
    all:unset; cursor:pointer; padding:9px 0; flex:1; text-align:center;
    font-size:13.5px; font-weight:500; color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  .seg-btn.active{ color:var(--pine); border-bottom-color:var(--gold); }
  .group-content{ padding:16px 18px 100px; }
  .refresh-row{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .refresh-btn{ all:unset; cursor:pointer; font-size:12px; color:var(--teal); font-weight:500; display:flex; align-items:center; gap:4px; }

  /* ---------- Feed ---------- */
  .feed{ display:flex; flex-direction:column; gap:18px; }
  .post-card{ background:#fff; border-radius:var(--radius); border:1px solid var(--line); overflow:hidden; cursor:pointer; }
  .post-head{ display:flex; align-items:center; gap:9px; padding:12px 14px 9px; }
  .post-head .name{ font-weight:600; font-size:13.5px; }
  .post-head .date{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }
  .post-img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--paper-dim); }
  .post-body{ padding:11px 14px 14px; }
  .post-caption{ font-size:14px; line-height:1.5; margin:0 0 9px; }
  .post-foot{ display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap; }
  .reaction-chip{ display:inline-flex; align-items:center; gap:4px; background:var(--paper-dim); border-radius:20px; padding:3px 9px; font-size:12px; }

  /* ---------- Calendar ---------- */
  .year-header{ margin-bottom:14px; }
  .year-header h3{ font-family:'Fraunces', serif; font-size:18px; margin:0 0 2px; font-weight:600; }
  .year-header span{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .months-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .month-block{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .month-title{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.7px; color:var(--ink-soft); margin-bottom:7px; }
  .day-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2.5px; }
  .day-cell{ aspect-ratio:1/1; border-radius:3px; background:var(--paper-dim); background-size:cover; background-position:center; }
  .day-cell.empty{ background:transparent; }
  .day-cell.has-photo{ cursor:pointer; box-shadow:inset 0 0 0 1px #fff; }
  .cal-legend{ display:flex; align-items:center; gap:7px; margin-top:16px; font-size:11px; color:var(--ink-soft); }
  .cal-legend .sw{ width:9px;height:9px;border-radius:3px; }

  /* ---------- Book ---------- */
  .book-intro p{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; }
  .book-spread{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; }
  .book-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .book-photo{ border-radius:8px; overflow:hidden; position:relative; }
  .book-photo img{ width:100%; height:110px; object-fit:cover; display:block; }
  .book-photo .cap{ position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg, transparent, rgba(30,42,34,0.75)); color:#fff; font-size:9.5px; padding:12px 6px 5px; font-family:'IBM Plex Mono', monospace; }
  .book-actions{ display:flex; flex-direction:column; gap:8px; padding-top:6px; border-top:1px dashed var(--line); }
  .book-price{ font-size:12px; color:var(--ink-soft); text-align:center; }

  /* ---------- Profile ---------- */
  .profile-content{ padding:24px 20px 90px; }
  .profile-head{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:26px; }
  .avatar-lg{ width:74px;height:74px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-size:28px; color:#fff; margin-bottom:12px; }
  .profile-head h3{ font-family:'Fraunces', serif; margin:0 0 3px; font-size:20px; }
  .profile-head .uname{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .profile-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .list-row{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; cursor:pointer; font-size:14px; }
  .list-row.danger{ color:var(--danger); }
  .my-photos-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:4px;
  }
  .my-photo-cell{
    position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; cursor:pointer;
  }
  .my-photo-cell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .my-photo-cell .mp-overlay{
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(180deg, transparent, rgba(30,42,34,0.8));
    color:#fff; font-size:9.5px; padding:16px 6px 5px; display:flex; flex-direction:column; gap:1px;
  }

  /* ---------- Forms (create/join group) ---------- */
  .form-content{ padding:22px 20px 40px; }
  .form-content h3{ font-family:'Fraunces', serif; font-size:20px; margin:0 0 6px; }
  .form-content .hint{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5; }

  /* ---------- FAB ---------- */
  .fab{
    position:absolute; right:20px; bottom:86px;
    width:54px;height:54px;border-radius:50%;
    background:var(--gold); color:var(--pine-deep);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:0 8px 20px -6px rgba(201,162,76,0.6);
    border:none; cursor:pointer; z-index:5;
  }
  .fab:hover{ background:var(--gold-soft); }

  /* ---------- Overlay / modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(24,39,32,0.62); display:none; align-items:flex-end; justify-content:center; z-index:40; }
  .overlay.open{ display:flex; }
  .modal-sheet{
    background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0;
    max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet-head{ display:flex; align-items:center; padding:16px 18px 12px; border-bottom:1px solid var(--line); gap:10px; }
  .sheet-head h4{ font-family:'Fraunces', serif; font-size:17px; margin:0; flex:1; }
  .sheet-body{ overflow-y:auto; flex:1; }

  .modal-img-wrap{ width:100%; aspect-ratio:4/3; background:var(--paper-dim); }
  .modal-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-caption{ padding:13px 18px; font-size:14px; line-height:1.5; border-bottom:1px solid var(--line); }
  .modal-reactions{ display:flex; gap:8px; padding:11px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .react-btn{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:5px; background:var(--paper-dim); border-radius:20px; padding:5px 11px; font-size:13px; }
  .react-btn:hover{ background:var(--gold-soft); }
  .react-btn.active-reaction{ background:var(--gold); color:var(--pine-deep); font-weight:600; }
  .modal-comments{ padding:12px 18px; display:flex; flex-direction:column; gap:11px; }
  .comment{ font-size:13.5px; line-height:1.5; }
  .comment .cname{ font-weight:600; margin-right:5px; }
  .edit-comment-btn{
    all:unset; cursor:pointer; font-size:11px; margin-left:7px; opacity:0.6; vertical-align:middle;
  }
  .edit-comment-btn:hover{ opacity:1; }
  .comment-edit-row{ display:flex; gap:8px; align-items:center; }
  .comment-edit-row .edit-comment-input{
    flex:1; border:1px solid var(--line); border-radius:16px; padding:6px 12px; font-size:13px; outline:none;
  }
  .comment-edit-row .save-comment-edit-btn{ all:unset; cursor:pointer; color:var(--teal); font-weight:600; font-size:13px; }
  .replies-row{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .reply-thumb{ width:50px; height:50px; border-radius:8px; object-fit:cover; border:1px solid var(--line); }
  .reply-add{ width:50px; height:50px; border-radius:8px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:18px; cursor:pointer; background:transparent; }
  .modal-footer{ padding:10px 14px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .modal-footer input[type=text]{ flex:1; border:1px solid var(--line); border-radius:20px; padding:9px 14px; font-size:13.5px; outline:none; }
  .mention-suggestions{
    position:absolute; bottom:100%; left:14px; right:14px; margin-bottom:6px;
    background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 -4px 16px rgba(31,51,41,0.12);
    max-height:180px; overflow-y:auto; z-index:5;
  }
  .mention-item{ display:flex; align-items:center; gap:8px; padding:9px 12px; font-size:13.5px; cursor:pointer; }
  .mention-item:hover{ background:var(--paper-dim); }
  .send-btn{ all:unset; cursor:pointer; background:var(--pine); color:var(--paper); padding:9px 16px; border-radius:20px; font-size:13px; font-weight:500; }

  /* add post sheet */
  .upload-zone{
    margin:16px 18px; border:1.5px dashed var(--line); border-radius:14px; padding:28px 16px;
    text-align:center; cursor:pointer; color:var(--ink-soft); font-size:13.5px;
  }
  .upload-zone.has-img{ padding:0; border-style:solid; overflow:hidden; }
  .upload-zone img{ width:100%; max-height:280px; object-fit:cover; display:block; }
  .form-block{ padding:0 18px 16px; }
  .checkbox-row{ display:flex; align-items:center; gap:9px; font-size:13.5px; padding:6px 0 16px; }

  .photo-strip{ display:flex; gap:8px; padding:16px 18px 4px; overflow-x:auto; }
  .photo-thumb{ position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; flex-shrink:0; }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb-remove{
    all:unset; position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%;
    background:rgba(24,39,32,0.75); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .photo-thumb-add{
    width:84px; height:84px; border-radius:10px; border:1.5px dashed var(--line); flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:var(--ink-soft); cursor:pointer; font-size:18px;
  }

  .tag-people-list{ display:flex; flex-direction:column; gap:2px; max-height:180px; overflow-y:auto; }
  .tag-person-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; font-size:13.5px; cursor:pointer; }
  .tag-person-row input{ margin:0; }

  .carousel{
    position:relative; width:100%; aspect-ratio:4/3; overflow-x:auto; display:flex;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; background:var(--paper-dim);
  }
  .carousel::-webkit-scrollbar{ display:none; }
  .carousel img{ flex:0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:center; }
  .carousel-dots{ position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:5px; pointer-events:none; }
  .carousel-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55); }
  .carousel-dot.active{ background:#fff; }
  .tagged-line{ font-size:12.5px; color:var(--ink-soft); padding:0 14px 8px; margin-top:-4px; }
  .location-line{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; }

  /* invite sheet */
  .invite-code{
    font-family:'IBM Plex Mono', monospace; font-size:30px; letter-spacing:6px; text-align:center;
    background:var(--paper-dim); border-radius:12px; padding:20px; margin:16px 18px; color:var(--pine); font-weight:600;
  }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--pine); color:var(--paper); padding:11px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:all 0.25s ease; z-index:60; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .install-banner{
    display:flex; align-items:center; gap:8px;
    background:var(--gold-soft); color:var(--pine-deep);
    padding:10px 12px; margin:0; font-size:12.5px;
  }
  .install-banner .ib-icon{ font-size:16px; flex-shrink:0; }
  .install-banner .ib-text{ flex:1; line-height:1.35; }
  .install-banner .ib-action{
    all:unset; cursor:pointer; background:var(--pine); color:var(--paper);
    padding:6px 11px; border-radius:8px; font-size:12px; font-weight:500; flex-shrink:0; white-space:nowrap;
  }
  .install-banner .ib-dismiss{
    all:unset; cursor:pointer; font-size:14px; color:var(--pine-deep); opacity:0.6; flex-shrink:0; padding:0 2px;

/* ===================== Image compression ===================== */
function compressImage(file, maxDim){
  if(maxDim === undefined) maxDim = 900;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = height*maxDim/width; width = maxDim; } }
        else{ if(height > maxDim){ width = width*maxDim/height; height = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        // Iteratively lower quality until the payload stays comfortably under storage limits.
        let quality = 0.6;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        let attempts = 0;
        while(dataUrl.length > 700000 && attempts < 4){
          quality = Math.max(0.25, quality - 0.12);
          dataUrl = canvas.toDataURL("image/jpeg", quality);
          attempts++;
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function fetchProfile(userId){
  try{
    const { data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
    if(error || !data) return null;
    return { id: userId, displayName: data.display_name, avatarColor: data.avatar_color, avatarPhoto: data.avatar_photo };
  }catch(e){ console.error("fetchProfile error", e); return null; }
}
async function upsertProfile(userId, fields){
  try{
    const row = { id: userId };
    if(fields.displayName !== undefined) row.display_name = fields.displayName;
    if(fields.avatarColor !== undefined) row.avatar_color = fields.avatarColor;
    if(fields.avatarPhoto !== undefined) row.avatar_photo = fields.avatarPhoto;
    const { error } = await sb.from("profiles").upsert(row);
    if(error){ console.error("upsertProfile error", error); return false; }
    return true;
  }catch(e){ console.error("upsertProfile error", e); return false; }
}
// Posts, comments and replies each store a snapshot of the author's name/avatar
// at the time they were published (so the feed doesn't need a live join for
// every render). When someone edits their profile, this pushes that update
// onto everything they've already published, so old content catches up too.
async function syncAuthorInfoEverywhere(userId, displayName, avatarColor, avatarPhoto){
  try{
    await Promise.all([
      sb.from("posts").update({ author_name: displayName, author_avatar_color: avatarColor, author_avatar_photo: avatarPhoto }).eq("author_id", userId),
      sb.from("comments").update({ author_name: displayName }).eq("author_id", userId),
      sb.from("replies").update({ author_name: displayName }).eq("author_id", userId)
    ]);
  }catch(e){ console.error("syncAuthorInfoEverywhere error", e); }
}

// Builds the in-memory currentUser object for a logged-in auth user, and
// repairs the profiles row on the spot if the display name is missing or
// still equal to the email (which can happen if it couldn't be saved at
// signup time while unauthenticated, pending email confirmation).
async function buildCurrentUser(authUser){
  const profile = await fetchProfile(authUser.id);
  const meta = authUser.user_metadata || {};
  let displayName = (profile && profile.displayName) || meta.display_name;
  let avatarColor = (profile && profile.avatarColor) || meta.avatar_color || PALETTE[0];
  let avatarPhoto = (profile && profile.avatarPhoto) || meta.avatar_photo || null;
  const brokenName = !displayName || displayName === authUser.email;
  if(brokenName){ displayName = authUser.email.split("@")[0]; }
  if(!profile || brokenName){
    await upsertProfile(authUser.id, { displayName, avatarColor, avatarPhoto });
  }
  if(brokenName){
    await syncAuthorInfoEverywhere(authUser.id, displayName, avatarColor, avatarPhoto);
  }
  return { id: authUser.id, email: authUser.email, displayName, avatarColor, avatarPhoto };
}

// Groups the current user belongs to — the database itself only returns rows
// this person is a real member of (enforced by Row Level Security), not the app.
async function loadGroupsList(){
  try{
    const { data: memberships, error } = await sb
      .from("group_members")
      .select("group_id, groups(id, name, subtitle, join_code, created_by)")
      .eq("user_id", currentUser.id);
    if(error) throw error;
    const groups = (memberships || []).map(m => m.groups).filter(Boolean);
    const groupIds = groups.map(g => g.id);
    let allMembers = [];
    if(groupIds.length){
      const { data: mdata } = await sb.from("group_members").select("group_id, user_id").in("group_id", groupIds);
      allMembers = mdata || [];
    }
    groupsData = groups.map(g => ({
      id: g.id, name: g.name, subtitle: g.subtitle || "",
      joinCode: g.join_code, createdBy: g.created_by,
      memberUsernames: allMembers.filter(m => m.group_id === g.id).map(m => m.user_id)
    }));
  }catch(e){ console.error("loadGroupsList error", e); groupsData = []; }
}

// Member profiles for a group (name/avatar), used by the "tag people" picker
// and the @mention autocomplete. Cached per group since it rarely changes.
async function loadGroupMemberProfiles(groupId){
  const group = getGroup(groupId);
  if(!group) return [];
  try{
    const { data, error } = await sb.from("profiles").select("*").in("id", group.memberUsernames);
    if(error) throw error;
    const list = (data || []).map(row => ({
      id: row.id, displayName: row.display_name || "?",
      avatarColor: row.avatar_color, avatarPhoto: row.avatar_photo
    }));
    memberProfilesCache[groupId] = list;
    return list;
  }catch(e){ console.error("loadGroupMemberProfiles error", e); return memberProfilesCache[groupId] || []; }
}

async function createGroupInDb(name, subtitle){
  const code = genCode();
  const groupId = crypto.randomUUID();
  const { error } = await sb.from("groups")
    .insert({ id: groupId, name, subtitle: subtitle || null, join_code: code, created_by: currentUser.id });
  if(error){ console.error("createGroup error", error); return { group: null, error }; }
  const { error: memberErr } = await sb.from("group_members").insert({ group_id: groupId, user_id: currentUser.id });
  if(memberErr){ console.error("createGroup member error", memberErr); return { group: null, error: memberErr }; }
  const group = {
    id: groupId, name, subtitle: subtitle || "",
    joinCode: code, createdBy: currentUser.id, memberUsernames: [currentUser.id]
  };
  groupsData.push(group);
  return { group, error: null };
}

// Fetches a group's photos plus their reactions/comments/replies, and assembles
// them into the same in-memory shape the rest of the app already expects.
async function loadGroupPosts(groupId){
  try{
    const { data: postsRows, error } = await sb.from("posts").select("*").eq("group_id", groupId).order("created_at", { ascending:false });
    if(error) throw error;
    const rows = postsRows || [];
    const postIds = rows.map(p => p.id);
    let reactions = [], comments = [], replies = [], extraPhotos = [], tags = [];
    if(postIds.length){
      const [r1, r2, r3, r4, r5] = await Promise.all([
        sb.from("reactions").select("*").in("post_id", postIds),
        sb.from("comments").select("*").in("post_id", postIds).order("created_at", { ascending:true }),
        sb.from("replies").select("*").in("post_id", postIds).order("created_at", { ascending:true }),
        sb.from("post_photos").select("*").in("post_id", postIds).order("position", { ascending:true }),
        sb.from("post_tags").select("post_id, user_id").in("post_id", postIds)
      ]);
      reactions = r1.data || []; comments = r2.data || []; replies = r3.data || [];
      extraPhotos = r4.data || []; tags = r5.data || [];
    }
    const taggedIds = [...new Set(tags.map(t => t.user_id))];
    let tagProfiles = {};
    if(taggedIds.length){
      const { data: profRows } = await sb.from("profiles").select("id, display_name").in("id", taggedIds);
      (profRows || []).forEach(p => { tagProfiles[p.id] = p.display_name; });
    }
    postsCache[groupId] = rows.map(p => {
      const ownPhotos = extraPhotos.filter(ph => ph.post_id === p.id).map(ph => ph.photo);
      return {
        id: p.id, date: p.post_date, createdAt: p.created_at,
        authorUsername: p.author_id, authorName: p.author_name,
        authorAvatarColor: p.author_avatar_color, authorAvatarPhoto: p.author_avatar_photo,
        caption: p.caption, photo: p.photo, favorite: p.favorite, location: p.location || "",
        photos: ownPhotos.length ? ownPhotos : [p.photo],
        taggedUsers: tags.filter(t => t.post_id === p.id).map(t => ({ id: t.user_id, displayName: tagProfiles[t.user_id] || "?" })),
        reactionsByUser: Object.fromEntries(reactions.filter(r => r.post_id === p.id).map(r => [r.user_id, r.emoji])),
        comments: comments.filter(c => c.post_id === p.id).map(c => ({ id: c.id, authorId: c.author_id, author: c.author_name, text: c.text })),
        replies: replies.filter(r => r.post_id === p.id).map(r => ({ author: r.author_name, img: r.img }))
      };
    });
  }catch(e){ console.error("loadGroupPosts error", e); postsCache[groupId] = []; }
}

async function insertPost(groupId, post){
  const postId = crypto.randomUUID();
  const photos = (post.photos && post.photos.length) ? post.photos : [post.photo];
  const { error } = await sb.from("posts").insert({
    id: postId, group_id: groupId, author_id: currentUser.id, author_name: currentUser.displayName,
    author_avatar_color: currentUser.avatarColor, author_avatar_photo: currentUser.avatarPhoto,
    post_date: post.date, caption: post.caption, photo: photos[0], favorite: post.favorite,
    location: post.location || null
  });
  if(error){ console.error("insertPost error", error); showToast("⚠️ Publication impossible pour l'instant."); return false; }
  if(photos.length){
    const rows = photos.map((photo, i) => ({ post_id: postId, photo, position: i }));
    const { error: photosErr } = await sb.from("post_photos").insert(rows);
    if(photosErr) console.error("insertPost photos error", photosErr);
  }
  if(post.taggedIds && post.taggedIds.length){
    const rows = post.taggedIds.map(uid => ({ post_id: postId, user_id: uid }));
    const { error: tagErr } = await sb.from("post_tags").insert(rows);
    if(tagErr) console.error("insertPost tags error", tagErr);
  }
  return true;
}

async function setReaction(postId, emoji){
  try{
    const { data: existing } = await sb.from("reactions").select("emoji").eq("post_id", postId).eq("user_id", currentUser.id).maybeSingle();

function myGroups(){
  if(!currentUser) return [];
  return groupsData.filter(g => g.memberUsernames.includes(currentUser.id));

function getGroup(id){ return groupsData.find(g => g.id === id); }

/* ===================== Unseen moments + app badge ===================== */
async function loadSeenMap(){
  try{
    const { data, error } = await sb.from("seen_status").select("group_id, seen_count").eq("user_id", currentUser.id);
    if(error) throw error;
    seenMap = {};
    (data || []).forEach(row => { seenMap[row.group_id] = row.seen_count; });
  }catch(e){ console.error("loadSeenMap error", e); seenMap = {}; }
}
async function markGroupSeen(groupId){
  const count = (postsCache[groupId] || []).length;
  if(seenMap[groupId] !== count){
    seenMap[groupId] = count;
    try{ await sb.from("seen_status").upsert({ user_id: currentUser.id, group_id: groupId, seen_count: count }); }
    catch(e){ console.error("markGroupSeen error", e); }
  }
}
function unseenCountFor(groupId){
  const total = (postsCache[groupId] || []).length;
  const seen = seenMap[groupId] || 0;
  return Math.max(0, total - seen);
}
function totalUnseenCount(){
  return myGroups().reduce((sum, g) => sum + unseenCountFor(g.id), 0);
}
function updateAppBadge(){
  if(!("setAppBadge" in navigator)) return;
  const total = totalUnseenCount();
  if(total > 0){ navigator.setAppBadge(total).catch(()=>{}); }
  else { navigator.clearAppBadge().catch(()=>{}); }
}
async function ensureAllMyPostsLoaded(){
  const groups = myGroups();
  for(const g of groups){
    if(!postsCache[g.id]){ await loadGroupPosts(g.id); }
  }
}
// Refresh unseen counts whenever the app regains focus — the closest we can get
// to "live" updates without a push-notification server (see note near setup).
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && currentUser){
    ensureAllMyPostsLoaded().then(()=>{
      updateAppBadge();
      if(screen === "home"){ render(); }
    });
  }
});

      </div>
    `;

  const dismissBtn = document.getElementById("install-dismiss");
  if(dismissBtn){ dismissBtn.addEventListener("click", ()=>{ installBannerDismissed = true; render(); }); }
  const installBtn = document.getElementById("install-action");
  if(installBtn){ installBtn.addEventListener("click", async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    render();
  }); }
  const helpBtn = document.getElementById("install-help-open");
  if(helpBtn){ helpBtn.addEventListener("click", ()=>{ modalType = "installHelp"; renderOverlay(); openOverlay(); }); }

  if(event === "PASSWORD_RECOVERY"){

  }

async function init(){
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("code");
  if(codeParam){ pendingJoinCode = codeParam.trim().toUpperCase(); }
  screen = "loading";
  render();

  // Give the recovery-link listener a brief moment to fire before deciding the screen.
  await new Promise(res => setTimeout(res, 300));
  if(recoveryInProgress) return;

  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    currentUser = await buildCurrentUser(session.user);
    await tryPendingJoin();
    return;
  }
  screen = "login";
  render();
}

  await loadGroupsList();
  await loadSeenMap();
  if(!pendingJoinCode){ screen = "home"; render(); ensureAllMyPostsLoaded().then(()=>{ updateAppBadge(); if(screen==="home"){ render(); } }); return; }
  const code = pendingJoinCode;
  pendingJoinCode = null;
  const groupId = await joinGroupByCodeInDb(code);
  if(!groupId){ showToast("Le lien d'invitation n'est plus valide."); screen = "home"; render(); return; }
  await loadGroupsList();
  activeGroupId = groupId;
  activeView = "fil";
  screen = "group";
  render();
  if(!postsCache[activeGroupId]){ await loadGroupPosts(activeGroupId); render(); }
  await markGroupSeen(activeGroupId);
  updateAppBadge();
  showToast(`Bienvenue dans ${g.name} 🎉`);
}

function render(){
  const shell = document.getElementById("app-shell");
  if(screen === "loading"){ shell.innerHTML = renderLoading(); return; }
  if(screen === "login"){ shell.innerHTML = renderAuth(); bindAuth(); return; }
  if(screen === "home"){ shell.innerHTML = renderHomeScreen(); bindHome(); return; }
  if(screen === "profile"){ shell.innerHTML = renderProfileScreen(); bindProfile(); return; }
  if(screen === "createGroup"){ shell.innerHTML = renderCreateGroupScreen(); bindCreateGroup(); return; }
  if(screen === "joinGroup"){ shell.innerHTML = renderJoinGroupScreen(); bindJoinGroup(); return; }
  if(screen === "group"){ shell.innerHTML = renderGroupScreen(); bindGroupScreen(); return; }
  if(screen === "resetPassword"){ shell.innerHTML = renderResetPasswordScreen(); bindResetPasswordScreen(); return; }
}

function bindResetPasswordScreen(){
  const errBox = document.getElementById("auth-error");
  function setError(msg){ if(errBox) errBox.innerHTML = msg ? `<p class="form-error">${msg}</p>` : ""; }
  document.getElementById("reset-submit").addEventListener("click", async (e)=>{
    const btn = e.currentTarget;
    const password = document.getElementById("reset-password").value;
    const confirm = document.getElementById("reset-password-confirm").value;
    if(!isStrongPassword(password)){ setError("Le mot de passe doit faire au moins 8 caractères, avec une majuscule et un caractère spécial."); return; }
    if(password !== confirm){ setError("Les deux mots de passe ne correspondent pas."); return; }
    btn.disabled = true; btn.textContent = "Enregistrement…";
    const { error } = await sb.auth.updateUser({ password });
    btn.disabled = false; btn.textContent = "Enregistrer le nouveau mot de passe";
    if(error){ setError("Impossible de changer le mot de passe pour l'instant."); return; }
    showToast("Mot de passe mis à jour ✅");
    const { data: { user } } = await sb.auth.getUser();
    if(user){
      currentUser = await buildCurrentUser(user);
      await loadSeenMap();
    }
    screen = "home";
    render();
  });
}
function bindAuth(){
  bindInstallBanner();
  document.querySelectorAll(".auth-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{ authMode = tab.dataset.mode; render(); });
  });
  const errBox = document.getElementById("auth-error");
  function setError(msg){ if(errBox) errBox.innerHTML = msg ? `<p class="form-error">${msg}</p>` : ""; }

  if(authMode === "forgotPassword"){
    document.getElementById("back-to-login").addEventListener("click", ()=>{ authMode = "login"; render(); });
    document.getElementById("forgot-submit").addEventListener("click", async ()=>{
      const email = document.getElementById("forgot-email").value.trim();
      if(!isValidEmail(email)){ setError("Entre un email valide."); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      if(error){
        console.error("resetPasswordForEmail error", error.status, error.message);
        setError("Erreur : " + error.message + (error.status ? " (code " + error.status + ")" : ""));
        return;
      }
      showToast("Email envoyé — vérifie ta boîte de réception 📬");
      authMode = "login";
      render();
    });
    return;
  }

  if(authMode === "login"){
    document.getElementById("forgot-password-link").addEventListener("click", ()=>{ authMode = "forgotPassword"; render(); });
    document.getElementById("login-submit").addEventListener("click", async (e)=>{
      const btn = e.currentTarget;
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if(!isValidEmail(email) || !password){ setError("Entre ton email et ton mot de passe."); return; }
      btn.disabled = true; btn.textContent = "Connexion…";
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false; btn.textContent = "Se connecter";
      if(error){ setError("Email ou mot de passe incorrect, ou compte non confirmé."); return; }
      currentUser = await buildCurrentUser(data.user);
      tryPendingJoin();
    });
  } else {
    document.querySelectorAll(".color-swatch").forEach(sw=>{
      sw.addEventListener("click", ()=>{ selectedColor = sw.dataset.color; render(); });
    });
    document.getElementById("signup-avatar-zone").addEventListener("click", ()=>{
      pendingAvatarTarget = "signup";
      document.getElementById("avatar-file").click();
    });
    document.getElementById("signup-submit").addEventListener("click", async (e)=>{
      const btn = e.currentTarget;
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const confirm = document.getElementById("signup-password-confirm").value;
      if(!name){ setError("Entre ton prénom."); return; }
      if(!isValidEmail(email)){ setError("Entre un email valide."); return; }
      if(!isStrongPassword(password)){ setError("Le mot de passe doit faire au moins 8 caractères, avec une majuscule et un caractère spécial."); return; }
      if(password !== confirm){ setError("Les deux mots de passe ne correspondent pas."); return; }
      btn.disabled = true; btn.textContent = "Création…";
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { display_name: name, avatar_color: selectedColor, avatar_photo: signupPhoto || null } }
      });
      if(error){
        btn.disabled = false; btn.textContent = "Créer mon compte";
        console.error("signUp error", error.status, error.message);
        setError("Erreur : " + error.message + (error.status ? " (code " + error.status + ")" : ""));
        return;
      }
      const userId = data.user && data.user.id;
      // If a session exists immediately (e.g. email confirmation is off), write the
      // profile now while authenticated. Otherwise it's created on first login instead,
      // using the display_name/avatar_color/avatar_photo metadata stashed above —
      // see buildCurrentUser().
      if(userId && data.session){
        await upsertProfile(userId, { displayName: name, avatarColor: selectedColor, avatarPhoto: signupPhoto || null });
      }
      btn.disabled = false; btn.textContent = "Créer mon compte";
      if(data.session){
        currentUser = await buildCurrentUser(data.user);
        signupPhoto = null;
        tryPendingJoin();
      } else {
        showToast("Compte créé — vérifie ta boîte mail pour confirmer, puis connecte-toi 📬");
        signupPhoto = null;
        authMode = "login";
        render();
      }
    });
  }
}

        .forEach(p => result.push({ post: p, groupId: g.id, groupName: g.name }));

function avatarHtml(name, color, photo, sizeStyle){
  const style = sizeStyle || "width:28px;height:28px;font-size:12px;";

  }
  return `<span class="avatar-lg" style="${style}background:${color || '#4C7A6C'}">${(name || "?")[0].toUpperCase()}</span>`;
}
// Renders a swipeable, native-scroll image carousel (CSS scroll-snap — no JS
// touch handling needed) with dot indicators when a post has multiple photos.
function renderCarousel(photos, carouselId){
  if(!photos || photos.length <= 1){
    return `<img class="post-img" src="${(photos && photos[0]) || ''}" alt="" loading="lazy"/>`;
  }
  return `
    <div class="carousel" id="${carouselId}" data-count="${photos.length}">
      ${photos.map(p => `<img src="${p}" alt="" loading="lazy"/>`).join("")}
    </div>
    <div class="carousel-dots" id="${carouselId}-dots">
      ${photos.map((_, i) => `<span class="carousel-dot ${i===0?'active':''}"></span>`).join("")}
    </div>
  `;
}
function bindCarousels(root){
  (root || document).querySelectorAll(".carousel").forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound = "1";
    const dots = document.getElementById(el.id + "-dots");
    if(!dots) return;
    el.addEventListener("scroll", ()=>{
      const idx = Math.round(el.scrollLeft / el.clientWidth);
      dots.querySelectorAll(".carousel-dot").forEach((d,i)=> d.classList.toggle("active", i===idx));
    });
  });
}
function reactionCounts(post){
  const counts = {};
  Object.values(post.reactionsByUser || {}).forEach(emoji => { counts[emoji] = (counts[emoji]||0) + 1; });
  return counts;
}
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* Calendar */
function daysInMonth(year, m){ return new Date(year, m+1, 0).getDate(); }
function firstWeekdayMon(year, m){ const d = new Date(year, m, 1).getDay(); return (d+6)%7; }
function renderCalendar(group, posts){
  const year = new Date().getFullYear();
  const byDate = {};
  posts.forEach(p => { byDate[p.date] = p; });
  const monthsHtml = MONTHS_FR.map((mName, mIdx) => {
    const leading = firstWeekdayMon(year, mIdx);
    const total = daysInMonth(year, mIdx);
    let cells = "";
    for(let i=0;i<leading;i++){ cells += `<div class="day-cell empty"></div>`; }
    for(let d=1; d<=total; d++){
      const dateStr = `${year}-${String(mIdx+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const post = byDate[dateStr];
      if(post){
        cells += `<div class="day-cell has-photo" data-post="${post.id}" style="background-image:url('${post.photo}')"></div>`;
      } else {
        cells += `<div class="day-cell"></div>`;
      }
    }
    return `<div class="month-block"><div class="month-title">${mName}</div><div class="day-grid">${cells}</div></div>`;
  }).join("");
  return `
    <div class="year-header">
      <h3>L'année en instants</h3>
      <span>${year} · ${posts.length} moment${posts.length>1?"s":""} capturé${posts.length>1?"s":""}</span>
    </div>
    <div class="months-grid">${monthsHtml}</div>
    <div class="cal-legend"><span class="sw" style="background:var(--gold-soft)"></span> jour partagé — appuie pour l'ouvrir</div>
  `;
}

function bindEditProfileSheet(){
  selectedColor = currentUser.avatarColor;

  function setError(msg){ errBox.innerHTML = msg ? `<p class="form-error">${msg}</p>` : ""; }

  document.getElementById("edit-avatar-zone").addEventListener("click", ()=>{
    pendingAvatarTarget = "editProfile";
    document.getElementById("avatar-file").click();

  const removeBtn = document.getElementById("remove-avatar-btn");

  }); }
  document.querySelectorAll("#edit-color-picker .color-swatch").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      selectedColor = sw.dataset.color;
      renderOverlay(); bindEditProfileSheet();
    });
  });
  document.getElementById("save-profile-btn").addEventListener("click", async (e)=>{
    const btn = e.currentTarget;
    const name = document.getElementById("edit-name").value.trim();
    const email = document.getElementById("edit-email").value.trim();
    const password = document.getElementById("edit-password").value;
    if(!name){ setError("Entre ton prénom."); return; }
    if(!isValidEmail(email)){ setError("Entre un email valide."); return; }
    if(password && !isStrongPassword(password)){ setError("Le mot de passe doit faire au moins 8 caractères, avec une majuscule et un caractère spécial."); return; }
    btn.disabled = true; btn.textContent = "Enregistrement…";

    const authUpdates = {};
    if(email !== currentUser.email) authUpdates.email = email;
    if(password) authUpdates.password = password;
    if(Object.keys(authUpdates).length){
      const { error } = await sb.auth.updateUser(authUpdates);
      if(error){
        btn.disabled = false; btn.textContent = "Enregistrer";
        setError("Impossible de mettre à jour l'email/mot de passe pour l'instant.");
        return;
      }
    }
    const finalPhoto = editProfilePhoto !== undefined ? editProfilePhoto : currentUser.avatarPhoto;
    await upsertProfile(currentUser.id, { displayName: name, avatarColor: selectedColor, avatarPhoto: finalPhoto });
    await syncAuthorInfoEverywhere(currentUser.id, name, selectedColor, finalPhoto);
    postsCache = {}; // stale author snapshots may be cached locally — force a fresh reload on next visit
    currentUser.displayName = name;
    currentUser.avatarColor = selectedColor;
    currentUser.avatarPhoto = finalPhoto;
    if(authUpdates.email) showToast("Vérifie ta nouvelle boîte mail pour confirmer le changement d'adresse 📬");
    else showToast("Profil mis à jour partout ✅");
    editProfilePhoto = undefined;
    btn.disabled = false; btn.textContent = "Enregistrer";
    closeOverlay();
    if(screen === "profile"){ render(); }
    else if(screen === "home"){ render(); }
  });
}

      const btn = e.currentTarget;
      const caption = document.getElementById("edit-caption-input").value.trim();
      btn.disabled = true; btn.textContent = "Enregistrement…";
      const fields = { caption: caption || "…" };
      if(editPostNewPhoto) fields.photo = editPostNewPhoto;
      await editPost(activeModalPostId, fields);
      await loadGroupPosts(group.id);
      postEditMode = false; editPostNewPhoto = null;
      renderOverlay(); bindPostDetailSheet();
      renderGroupContentOnly();
      showToast("Photo mise à jour ✅");
    });
  }
  const deletePostBtn = document.getElementById("delete-post-btn");
  if(deletePostBtn){
    deletePostBtn.addEventListener("click", async ()=>{
      if(!confirm("Supprimer définitivement cette photo, avec ses commentaires et réactions ?")) return;
      await deletePost(activeModalPostId);
      await loadGroupPosts(group.id);
      closeOverlay();
      renderGroupContentOnly();
      showToast("Photo supprimée");
    });
  }

  // Comment author can edit their own comment inline.
  document.querySelectorAll(".edit-comment-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      editingCommentId = btn.dataset.comment;
      renderOverlay(); bindPostDetailSheet();
    });
  });
  document.querySelectorAll(".save-comment-edit-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const row = btn.closest(".comment-edit-row");
      const val = row.querySelector(".edit-comment-input").value.trim();
      if(!val) return;
      await editComment(btn.dataset.comment, val);
      await loadGroupPosts(group.id);
      editingCommentId = null;
      renderOverlay(); bindPostDetailSheet();
    });
  });

  const sendBtn = document.getElementById("comment-send");
  const input = document.getElementById("comment-input");
  const mentionBox = document.getElementById("mention-suggestions");
  if(!memberProfilesCache[group.id]){
    loadGroupMemberProfiles(group.id); // fire-and-forget; ready by the next keystroke
  }
  function getMentionQuery(){
    const pos = input.selectionStart;
    const text = input.value.slice(0, pos);
    const m = text.match(/(?:^|\s)@([a-zA-ZÀ-ÿ0-9_]*)$/);
    return m ? m[1] : null;
  }
  input.addEventListener("input", ()=>{
    const query = getMentionQuery();
    if(query === null){ mentionBox.style.display = "none"; return; }
    const members = (memberProfilesCache[group.id] || [])
      .filter(m => m.id !== currentUser.id && m.displayName.toLowerCase().startsWith(query.toLowerCase()));
    if(!members.length){ mentionBox.style.display = "none"; return; }
    mentionBox.innerHTML = members.slice(0, 5).map(m => `
      <div class="mention-item" data-name="${escapeHtml(m.displayName)}">
        ${avatarHtml(m.displayName, m.avatarColor, m.avatarPhoto, "width:22px;height:22px;font-size:10px;")}
        <span>${escapeHtml(m.displayName)}</span>
      </div>
    `).join("");
    mentionBox.style.display = "block";
    mentionBox.querySelectorAll(".mention-item").forEach(item=>{
      item.addEventListener("click", ()=>{
        const name = item.dataset.name;
        const pos = input.selectionStart;
        const before = input.value.slice(0, pos).replace(/(?:^|\s)@([a-zA-ZÀ-ÿ0-9_]*)$/, (m0)=> (m0[0]===" "?" ":"") + "@" + name + " ");
        const after = input.value.slice(pos);
        input.value = before + after;
        mentionBox.style.display = "none";
        input.focus();
      });
    });
  });
  async function submitComment(){
    if(commentSubmitting || sendBtn.disabled) return;
    const val = input.value.trim();
    if(!val) return;
    mentionBox.style.display = "none";
    commentSubmitting = true;
    sendBtn.disabled = true;
    input.disabled = true;
    input.value = "";
    await insertComment(activeModalPostId, val);
    await loadGroupPosts(group.id);
    commentSubmitting = false;
    renderOverlay(); bindPostDetailSheet();
    renderGroupContentOnly();
  }
  sendBtn.addEventListener("click", submitComment);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter" && mentionBox.style.display==="none"){ e.preventDefault(); submitComment(); } });
}
document.getElementById("edit-photo-file").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  e.target.value = "";
  if(!file || !pendingEditPostId) return;
  editPostNewPhoto = await compressImage(file);
  pendingEditPostId = null;
  if(modalType === "postDetail"){ renderOverlay(); bindPostDetailSheet(); }
  showToast("Nouvelle photo prête — clique \"Enregistrer\" pour valider");
});
document.getElementById("reply-file").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file || !pendingReplyPostId) return;
  const dataUrl = await compressImage(file);
  const group = getGroup(activeGroupId);
  const replyToId = pendingReplyPostId;
  await insertReply(replyToId, dataUrl);
  await loadGroupPosts(group.id);
  e.target.value = "";
  renderOverlay(); bindPostDetailSheet();
  showToast("Photo ajoutée en réponse 📸");
});
document.getElementById("avatar-file").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  e.target.value = "";
  if(!file || !pendingAvatarTarget) return;
  const dataUrl = await compressImage(file, 300);
  if(pendingAvatarTarget === "signup"){
    signupPhoto = dataUrl;
    render();
  } else if(pendingAvatarTarget === "editProfile"){
    editProfilePhoto = dataUrl;
    renderOverlay(); bindEditProfileSheet();
  }
  pendingAvatarTarget = null;
});

function renderAddPostSheet(){
  const members = (memberProfilesCache[activeGroupId] || []).filter(m => m.id !== currentUser.id);
  return `
    <div class="sheet-head">
      <h4>Nouveau moment</h4>
      <button class="icon-btn" style="color:var(--ink)" id="close-sheet">✕</button>
    </div>
    <div class="sheet-body">
      <div class="photo-strip" id="photo-strip">
        ${newPostPhotos.map((p, i) => `
          <div class="photo-thumb">
            <img src="${p}" alt=""/>
            <button class="photo-thumb-remove" data-index="${i}">✕</button>
          </div>
        `).join("")}
        <div class="photo-thumb-add" id="add-photo-zone">
          <span>📷</span><span style="font-size:10.5px;">${newPostPhotos.length ? "Ajouter" : "Choisir"}</span>
        </div>
      </div>
      <div class="form-block">
        <div class="field">
          <label>Légende</label>
          <input type="text" id="post-caption" placeholder="Raconte ce moment…" />
        </div>
        <div class="field">
          <label>Lieu (facultatif)</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="post-location" placeholder="ex. Annecy, France" value="${escapeHtml(newPostLocation)}" style="flex:1;" />
            <button class="icon-btn" style="background:var(--paper-dim); color:var(--pine); border-radius:10px; width:44px;" id="use-location-btn" title="Utiliser ma position">📍</button>
          </div>
        </div>
        ${members.length ? `
          <div class="field">
            <label>Taguer des personnes (facultatif)</label>
            <div class="tag-people-list">
              ${members.map(m => `
                <label class="tag-person-row">
                  <input type="checkbox" class="tag-person-checkbox" value="${m.id}" ${newPostTaggedIds.includes(m.id) ? "checked":""}/>
                  ${avatarHtml(m.displayName, m.avatarColor, m.avatarPhoto, "width:24px;height:24px;font-size:10px;")}
                  <span>${escapeHtml(m.displayName)}</span>
                </label>
              `).join("")}
            </div>
          </div>
        ` : ""}
        <label class="checkbox-row">
          <input type="checkbox" id="post-favorite" ${newPostFavorite?'checked':''}/> ⭐ Ajouter à la sélection du livre de l'année
        </label>
        <button class="btn-primary" id="publish-post" ${newPostPhotos.length ? "" : "disabled"}>Publier</button>
      </div>
    </div>
  `;
}
function bindAddPostSheet(){
  document.getElementById("close-sheet").addEventListener("click", closeOverlay);
  document.getElementById("add-photo-zone").addEventListener("click", ()=> document.getElementById("hidden-file").click());
  document.querySelectorAll(".photo-thumb-remove").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      newPostPhotos.splice(Number(btn.dataset.index), 1);
      renderOverlay(); bindAddPostSheet();
    });
  });
  const favCheck = document.getElementById("post-favorite");
  favCheck.addEventListener("change", ()=>{ newPostFavorite = favCheck.checked; });
  const locationInput = document.getElementById("post-location");
  locationInput.addEventListener("input", ()=>{ newPostLocation = locationInput.value; });
  document.getElementById("use-location-btn").addEventListener("click", async (e)=>{
    const btn = e.currentTarget;
    if(!navigator.geolocation){ showToast("Localisation non disponible sur cet appareil."); return; }
    btn.textContent = "…";
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      try{
        const { latitude, longitude } = pos.coords;
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=fr`);
        const data = await res.json();
        const place = [data.city || data.locality, data.countryName].filter(Boolean).join(", ");
        newPostLocation = place || `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`;
      }catch(e){ showToast("Impossible de récupérer le lieu."); }
      btn.textContent = "📍";
      renderOverlay(); bindAddPostSheet();
    }, ()=>{ btn.textContent = "📍"; showToast("Localisation refusée ou indisponible."); }, { timeout: 8000 });
  });
  document.querySelectorAll(".tag-person-checkbox").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      if(cb.checked){ if(!newPostTaggedIds.includes(cb.value)) newPostTaggedIds.push(cb.value); }
      else { newPostTaggedIds = newPostTaggedIds.filter(id => id !== cb.value); }
    });
  });
  document.getElementById("publish-post").addEventListener("click", async (e)=>{
    if(!newPostPhotos.length) return;
    const btn = e.currentTarget;
    if(btn.disabled) return; // guard against double-tap submitting twice
    btn.disabled = true;
    btn.textContent = "Publication…";
    const caption = document.getElementById("post-caption").value.trim();
    const group = getGroup(activeGroupId);
    const post = {
      date: todayISO(), caption: caption || "…", photos: newPostPhotos, favorite: newPostFavorite,
      location: newPostLocation.trim(), taggedIds: newPostTaggedIds
    };
    await insertPost(group.id, post);
    await loadGroupPosts(group.id);
    closeOverlay();
    renderGroupContentOnly();
    showToast("Photo publiée 🎉");
  });
}
document.getElementById("hidden-file").addEventListener("change", async (e)=>{
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  for(const file of files){
    newPostPhotos.push(await compressImage(file));
  }
  e.target.value = "";
  if(modalType === "addPost"){ renderOverlay(); bindAddPostSheet(); }
});

function inviteLink(group){
  return window.location.origin + window.location.pathname + "?code=" + group.joinCode;
}
function renderInviteSheet(){
  const group = getGroup(activeGroupId);
  return `
    <div class="sheet-head">
      <h4>Inviter dans ${escapeHtml(group.name)}</h4>
      <button class="icon-btn" style="color:var(--ink)" id="close-sheet">✕</button>
    </div>
    <div class="sheet-body">
      <p style="padding:16px 18px 0; font-size:13.5px; color:var(--ink-soft); line-height:1.5;">Le plus simple : envoie le lien ci-dessous par SMS ou WhatsApp. Tes amis appuient dessus, créent leur compte, et rejoignent le groupe automatiquement — sans rien taper.</p>
      <div class="form-block" style="padding-top:16px;">
        <button class="btn-primary" id="share-link">🔗 Partager le lien d'invitation</button>
        <p class="section-label" style="margin-top:22px;">Ou avec le code</p>
        <div class="invite-code" style="margin:0; padding:16px;">${group.joinCode}</div>
        <button class="btn-secondary" id="copy-code" style="margin-top:10px;">Copier juste le code</button>
      </div>
    </div>
  `;
}
function bindInviteSheet(){
  document.getElementById("close-sheet").addEventListener("click", closeOverlay);
  const group = getGroup(activeGroupId);
  document.getElementById("share-link").addEventListener("click", async ()=>{
    const link = inviteLink(group);
    if(navigator.share){
      try{ await navigator.share({ title: "Rejoins " + group.name + " sur Instants", url: link }); }
      catch(e){ /* user cancelled share, no-op */ }
    } else {
      try{ await navigator.clipboard.writeText(link); showToast("Lien copié !"); }
      catch(e){ showToast("Lien : " + link); }
    }
  });
  document.getElementById("copy-code").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(group.joinCode); showToast("Code copié !"); }
    catch(e){ showToast("Code : " + group.joinCode); }
  });
}

document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeOverlay(); });

/* ===================== Init ===================== */
init();
</script>
</body>
</html>
